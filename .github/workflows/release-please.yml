name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: ${{ steps.release.outputs.release_created }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ steps.release.outputs.release_created }}
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - if: ${{ steps.release.outputs.release_created }}
        run: npm ci
      - if: ${{ steps.release.outputs.release_created }}
        run: npm test
      # Trusted publishing (OIDC): npm verifies this workflow's identity via the
      # id-token above, so there is no long-lived token to store or leak. Configured
      # with `npm trust github cloudflare-axi --repo <nwo> --file release-please.yml`.
      # Provenance is generated automatically; no NODE_AUTH_TOKEN.
      - if: ${{ steps.release.outputs.release_created }}
        run: npm publish --access public
